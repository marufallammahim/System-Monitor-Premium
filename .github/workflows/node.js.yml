name: GNOME Extension CI

on:
  push:
    branches: ["main", "compat/**"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq glib2.0-bin python3-venv

      - name: Validate metadata.json and GNOME Shell support range
        run: |
          jq empty metadata.json
          python3 - <<'PY'
          import json
          with open('metadata.json', 'r', encoding='utf-8') as f:
              data = json.load(f)

          required = ['uuid', 'name', 'description', 'shell-version', 'version']
          missing = [key for key in required if key not in data]
          if missing:
              raise SystemExit(f'Missing required metadata keys: {missing}')

          expected = [str(v) for v in range(45, 52)]
          actual = data['shell-version']
          if actual != expected:
              raise SystemExit(f'Expected GNOME Shell support {expected}, got {actual}')

          print(f"UUID: {data['uuid']}")
          print(f"Shell versions: {', '.join(actual)}")
          PY

      - name: Check required extension files
        run: |
          test -f extension.js
          test -f prefs.js
          test -f stylesheet.css
          test -d schemas
          test -f schemas/org.gnome.shell.extensions.system-monitor-premium.gschema.xml

      - name: Compile GSettings schemas
        run: glib-compile-schemas --strict schemas

      - name: Syntax check every JavaScript file
        run: |
          find . -type f -name '*.js' -not -path './.git/*' -print0 |
            xargs -0 -r -n1 node --check

      - name: Verify extension package layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          required = [
              Path('extension.js'),
              Path('prefs.js'),
              Path('stylesheet.css'),
              Path('metadata.json'),
              Path('schemas/org.gnome.shell.extensions.system-monitor-premium.gschema.xml'),
          ]
          missing = [str(path) for path in required if not path.exists()]
          if missing:
              raise SystemExit(f'Missing required paths: {missing}')
          print('Extension layout looks valid.')
          PY

      - name: Run Shexli static analyzer
        run: |
          python3 -m venv /tmp/shexli-venv
          /tmp/shexli-venv/bin/python -m pip install --upgrade pip
          /tmp/shexli-venv/bin/python -m pip install --upgrade shexli
          /tmp/shexli-venv/bin/python - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          root = Path.cwd()
          archive = Path('/tmp/system-monitor-premium-shexli.zip')
          excluded = {'.git', 'venv', '__pycache__'}
          with ZipFile(archive, 'w', ZIP_DEFLATED) as package:
              for path in root.rglob('*'):
                  if not path.is_file() or any(part in excluded for part in path.relative_to(root).parts):
                      continue
                  if path.name == 'gschemas.compiled':
                      continue
                  package.write(path, path.relative_to(root))
          print(f'Created analyzer input: {archive}')
          PY
          /tmp/shexli-venv/bin/shexli /tmp/system-monitor-premium-shexli.zip
